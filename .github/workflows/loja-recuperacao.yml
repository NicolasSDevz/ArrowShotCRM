# Carrinhos abandonados da Loja: dispara os e-mails de recuperação do Archer
# e os avisos no celular sem depender de alguém abrir o CRM. Também roda os
# follow-ups do WhatsApp e o WhatsApp do carrinho abandonado (api/whatsapp). O plano Hobby
# da Vercel só deixa cron 1x por dia.
#
# Desde 29/10/2026 quem chama essas duas URLs é o cron-job.org (WhatsApp a cada 5 min,
# Loja a cada 10 min): o agendamento do GitHub atrasava horas. Aqui ficou só o botão
# de rodar à mão (Actions > Run workflow), como reserva.
name: Loja - recuperação de carrinhos

on:
  workflow_dispatch:

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Disparar varredura
        run: curl -fsS --max-time 120 'https://arrowshotcrm.vercel.app/api/loja?action=recovery-sweep'
      - name: WhatsApp (follow-up e carrinho)
        if: always()
        run: curl -fsS --max-time 120 'https://arrowshotcrm.vercel.app/api/whatsapp/sweep'
